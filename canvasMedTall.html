<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas med tall – Interaktiv programmering for skolen</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: lightblue;
        }

        #page {
            display: flex;
        }

        canvas {
            width: 50vh;
            height: 50vh;
            background-color: white;
            image-rendering: pixelated;
        }

        #numbersDiv {
            display: grid;
        }

        input {
            width: 30%;
        }
    </style>
</head>
<body>
    <div id="page">
        <canvas id="canvas"></canvas>
        <div id="numbersDiv"></div>
    </div>

    <script>
        const canvasSize = 5
        const canvas = document.querySelector('#canvas')
        const context = canvas.getContext('2d')
        const numbersDiv = document.querySelector('#numbersDiv')

        canvas.width = canvasSize
        canvas.height = canvasSize

        context.fillStyle = 'green'
        context.fillRect(0, 0, 3, 3)
        context.fillStyle = 'blue'
        context.fillRect(1, 1, 3, 3)

        let imageData = context.getImageData(0, 0, canvasSize, canvasSize)
        numbersDiv.style.gridTemplateColumns = `repeat(${canvasSize}, 1fr)`

        showNumbers()

        function showNumbers() {
            numbersDiv.innerHTML = range(0, canvasSize * canvasSize)
                .map(createHtmlForNumber)
                .join('')
        }

        function createHtmlForNumber(pixelIndex) {
            const baseIndex = pixelIndex * 4
            const x = pixelIndex % canvasSize
            const y = Math.floor(pixelIndex / canvasSize)

            return `
                <div class="pixel">
                    <b>(${x},${y}):</b><br>
                    ${range(0, 4).map(i => `
                        ${'RGBA'[i]}:
                        <input
                            type="range"
                            min="0"
                            max="255"
                            step="1"
                            value="${imageData.data[baseIndex + i]}"
                            oninput="updateImage(${baseIndex + i}, this.value)"
                            onchange="showNumbers()"
                        >
                        ${imageData.data[baseIndex + i]}<br>
                    `).join('')}
                </div>
            `
        }

        function updateImage(index, newValue) {
            imageData.data[index] = newValue
            context.putImageData(imageData, 0, 0)
        }

        function tegnPiksel(x, y, r, g, b) {
            const pixelIndex = y * canvasSize + x
            const index = pixelIndex * 4

            imageData.data[index] = r
            imageData.data[index + 1] = g
            imageData.data[index + 2] = b
            imageData.data[index + 3] = 255

            context.putImageData(imageData, 0, 0)
            showNumbers()
        }

        function range(fromInclusive, toExclusive) {
            const rangeLength = toExclusive - fromInclusive
            return Array.from(new Array(rangeLength).keys()).map(n => n + fromInclusive)
        }

        function fjernAlt() {
            context.clearRect(0, 0, canvasSize, canvasSize)
            imageData = context.getImageData(0, 0, canvasSize, canvasSize)
            showNumbers()
        }
    </script>
</body>
</html>
